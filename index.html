<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457F5">
<title>일정케어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#12161C; --muted:#667080;
  --line:#E1E5EB; --accent:#2457F5; --accent-ink:#FFFFFF; --accent-soft:#E6ECFE;
  --danger:#C23B22; --danger-soft:#FBE9E5;
  --font-body:"Noto Sans KR",system-ui,-apple-system,sans-serif;
  --font-mono:"DM Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D1015; --surface:#161A21; --ink:#EDF0F5; --muted:#8A93A1;
    --line:#262C36; --accent:#6F90FF; --accent-ink:#0B1020; --accent-soft:#1B2547;
    --danger:#F0856F; --danger-soft:#3A1E19; color-scheme:dark;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;padding:20px 16px 80px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.mono{font-family:var(--font-mono)}

.top{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;color:var(--accent)}
.top time{font-size:13px;color:var(--muted)}

.speak{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;background:var(--surface);padding:20px;border-radius:18px;border:1px solid var(--line)}
.speak h1{font-size:22px;font-weight:700}
.lead{font-size:14px;color:var(--muted)}

.mic{
  position:relative;width:80px;height:80px;border-radius:50%;border:0;
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 30%,transparent);
  transition:transform .15s ease;
}
.mic:active{transform:scale(.95)}
.mic svg{width:36px;height:36px}
.ring{position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);opacity:0;pointer-events:none}
.mic.on .ring{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9);opacity:.6}100%{transform:scale(1.3);opacity:0}}

.status{font-size:14px;font-weight:500;color:var(--accent);min-height:1.5em}
.hint{font-size:12px;color:var(--muted);line-height:1.4}

.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.editing{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.card-head{display:flex;justify-content:space-between;align-items:center}
.lab{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:0.05em}
.field{display:flex;flex-direction:column;gap:4px}
input[type="text"],input[type="date"],input[type="time"]{
  width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .wide{grid-column:1 / -1}

.actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.btn{
  display:flex;align-items:center;justify-content:center;width:100%;height:46px;border-radius:10px;
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;border:0;text-decoration:none;
}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}

.saved{display:flex;flex-direction:column;gap:10px}
.list{list-style:none;display:flex;flex-direction:column;gap:10px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.row-title{font-weight:700;font-size:16px}
.row-meta{font-size:13px;color:var(--muted)}
.row-acts{display:flex;gap:6px;margin-top:4px}
.mini{padding:6px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;font-size:13px;cursor:pointer;color:var(--ink);text-decoration:none}
.mini.danger{color:var(--danger);border-color:var(--danger)}

#splash{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#FFF;color:#2457F5;gap:16px;cursor:pointer}
#splash.done{opacity:0;pointer-events:none;transition:opacity .3s ease}
#splash h2{font-size:28px;font-weight:700}
</style>
</head>
<body>

<div id="splash">
  <h2>일정케어</h2>
  <p>화면을 터치하면 안내 음성이 시작됩니다</p>
</div>

<main class="app">
  <header class="top">
    <span class="brand">일정케어</span>
    <time id="today" class="mono"></time>
  </header>

  <section class="speak">
    <h1>일정을 말로 등록하세요</h1>
    <p class="lead">"12시 평광 친구약속"처럼 말씀해 보세요</p>
    <button id="mic" class="mic" type="button" aria-label="음성인식 시작">
      <div class="ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
    </button>
    <p id="status" class="status">버튼을 눌러 음성 입력을 시작하세요</p>
    <p class="hint">말씀 후 "저장", "수정", "취소", "삭제" 명령어로 조작할 수 있습니다.</p>
  </section>

  <section id="card" class="card">
    <div class="card-head">
      <span id="card-h" class="lab">새 일정 입력</span>
    </div>
    <label class="field"><span class="lab">일정 제목</span><input id="f-title" type="text" placeholder="예: 친구약속"></label>
    <div class="grid">
      <label class="field wide"><span class="lab">날짜</span><input id="f-date" type="date"></label>
      <label class="field"><span class="lab">시작 시간</span><input id="f-start" type="time"></label>
      <label class="field"><span class="lab">종료 시간</span><input id="f-end" type="time"></label>
    </div>
    <label class="field"><span class="lab">장소</span><input id="f-loc" type="text" placeholder="예: 평광"></label>
    
    <div class="actions">
      <button id="b-save" class="btn primary" type="button">일정 저장하기</button>
      <button id="b-cancel" class="btn ghost" type="button" hidden>취소</button>
      <button id="b-delete" class="btn danger" type="button" hidden>삭제</button>
    </div>
  </section>

  <section class="saved">
    <span class="lab">저장된 일정</span>
    <ul id="list" class="list"></ul>
  </section>
</main>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  
  const fTitle = $('f-title'), fDate = $('f-date'), fStart = $('f-start'), fEnd = $('f-end'), fLoc = $('f-loc');
  const bSave = $('b-save'), bCancel = $('b-cancel'), bDelete = $('b-delete');
  const statusEl = $('status'), micBtn = $('mic'), listEl = $('list');

  let items = JSON.parse(localStorage.getItem('voice_events') || '[]');
  let isListening = false, recognition = null, synth = window.speechSynthesis;
  let activeId = null;

  // 오늘 날짜 표시
  const now = new Date();
  $('today').textContent = (now.getMonth()+1) + '월 ' + now.getDate() + '일';
  fDate.value = ymd(now);

  // 음성 출력 (TTS) 함수 (오디오 브라우저 락 해제 지원)
  function speak(text, callback) {
    if(!synth) return;
    synth.cancel(); // 이전 음성 취소
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'ko-KR';
    utterance.rate = 1.0;
    utterance.onend = () => { if(callback) callback(); };
    synth.speak(utterance);
  }

  // 시작 스플래시 화면 터치 시 음성 활성화
  $('splash').addEventListener('click', () => {
    $('splash').classList.add('done');
    speak('일정케어 앱이 시작되었습니다. 일정을 말씀해 주세요.');
  });

  // 파싱 함수: "12시 평광 친구약속" 처리
  function parseSpeech(text) {
    let title = text, loc = '', time = '', date = ymd(new Date());

    // 시간 추출 (예: 12시, 오후 3시)
    const timeMatch = text.match(/(오전|오후)?\s*(\d{1,2})\s*시/);
    if(timeMatch) {
      let hour = parseInt(timeMatch[2]);
      if(timeMatch[1] === '오후' && hour < 12) hour += 12;
      if(timeMatch[1] === '오전' && hour === 12) hour = 0;
      time = pad(hour) + ':00';
      text = text.replace(timeMatch[0], '').trim();
    }

    // 장소 및 제목 분리 (주요 키워드 패턴)
    const words = text.split(' ');
    if(words.length >= 2) {
      loc = words[0]; // 첫 단어를 장소로 추정 (예: 평광)
      title = words.slice(1).join(' '); // 나머지를 제목으로 추정 (예: 친구약속)
    } else {
      title = text;
    }

    return { title, loc, time, date };
  }

  // 화면 필드 갱신
  function setFields(parsed) {
    if(parsed.title) fTitle.value = parsed.title;
    if(parsed.loc) fLoc.value = parsed.loc;
    if(parsed.time) {
      fStart.value = parsed.time;
      const [h, m] = parsed.time.split(':').map(Number);
      fEnd.value = pad(Math.min(h+1, 23)) + ':' + pad(m);
    }
    if(parsed.date) fDate.value = parsed.date;
  }

  // 음성 명령어 처리 로직 (저장, 삭제, 취소, 수정)
  function processCommand(text) {
    const cleanText = text.replace(/\s+/g, '');

    if(cleanText.includes('저장') || cleanText.includes('등록')) {
      saveEvent();
      return true;
    }
    if(cleanText.includes('취소')) {
      resetForm();
      speak('입력을 취소했습니다.');
      return true;
    }
    if(cleanText.includes('삭제')) {
      if(activeId) {
        deleteEvent(activeId);
      } else {
        speak('삭제할 일정을 먼저 선택해 주세요.');
      }
      return true;
    }
    if(cleanText.includes('수정')) {
      speak('어느 일정을 수정할까요? 목록에서 일정을 말해 주시거나 수정할 내용을 말씀하세요.');
      return true;
    }
    return false;
  }

  // 일정 저장
  function saveEvent() {
    if(!fTitle.value.trim()) {
      speak('일정 제목이 없습니다. 제목을 말씀해 주세요.');
      return;
    }
    const newEvent = {
      id: activeId || Date.now(),
      title: fTitle.value,
      date: fDate.value,
      start: fStart.value,
      end: fEnd.value,
      loc: fLoc.value
    };

    if(activeId) {
      items = items.map(item => item.id === activeId ? newEvent : item);
      speak('일정이 수정되었습니다.');
    } else {
      items.push(newEvent);
      speak(`제목 ${newEvent.title}, 시간 ${newEvent.start || '종일'}, 장소 ${newEvent.loc || '미정'}으로 일정이 등록되었습니다.`);
    }

    localStorage.setItem('voice_events', JSON.stringify(items));
    resetForm();
    renderList();
  }

  // 일정 삭제
  function deleteEvent(id) {
    items = items.filter(item => item.id !== id);
    localStorage.setItem('voice_events', JSON.stringify(items));
    speak('일정이 삭제되었습니다.');
    resetForm();
    renderList();
  }

  function resetForm() {
    activeId = null;
    fTitle.value = '';
    fLoc.value = '';
    fStart.value = '';
    fEnd.value = '';
    fDate.value = ymd(new Date());
    bSave.textContent = '일정 저장하기';
    bCancel.hidden = true;
    bDelete.hidden = true;
  }

  // 삼성 캘린더 호출용 Intent 생성
  function getSamsungCalendarIntent(item) {
    const startParts = (item.start || '09:00').split(':');
    const startDate = new Date(item.date);
    startDate.setHours(startParts[0], startParts[1]);
    const beginTime = startDate.getTime();
    const endTime = beginTime + 3600000;

    return `intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.item/event;S.title=${encodeURIComponent(item.title)};S.eventLocation=${encodeURIComponent(item.loc)};l.beginTime=${beginTime};l.endTime=${endTime};end`;
  }

  // 목록 작성
  function renderList() {
    listEl.innerHTML = '';
    items.forEach(item => {
      const li = document.createElement('li');
      li.className = 'row';
      const intentUrl = getSamsungCalendarIntent(item);
      li.innerHTML = `
        <div class="row-title">${item.title}</div>
        <div class="row-meta">${item.date} ${item.start || '종일'} | 장소: ${item.loc || '없음'}</div>
        <div class="row-acts">
          <button class="mini edit-btn">수정</button>
          <button class="mini danger del-btn">삭제</button>
          <a class="mini" href="${intentUrl}">삼성 캘린더 추가</a>
        </div>
      `;
      li.querySelector('.edit-btn').onclick = () => {
        activeId = item.id;
        setFields(item);
        bSave.textContent = '수정 완료';
        bCancel.hidden = false;
        bDelete.hidden = false;
      };
      li.querySelector('.del-btn').onclick = () => deleteEvent(item.id);
      listEl.appendChild(li);
    });
  }

  // 음성 인식 시작 (Web Speech API)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('on');
      statusEl.textContent = '듣고 있습니다...';
    };

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      statusEl.textContent = `인식됨: "${transcript}"`;

      // 1. 명령어인지 판별
      const isCmd = processCommand(transcript);

      // 2. 명령어 아니면 일정 파싱 수행
      if(!isCmd) {
        const parsed = parseSpeech(transcript);
        setFields(parsed);
        speak(`제목 ${parsed.title}, 시간 ${parsed.time || '종일'}, 장소 ${parsed.loc || '미정'}으로 등록할까요? 저장하시려면 저장을 말씀하세요.`);
      }
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('on');
    };

    recognition.onerror = (e) => {
      statusEl.textContent = '음성 인식 오류가 발생했습니다.';
      micBtn.classList.remove('on');
    };
  }

  micBtn.onclick = () => {
    if(isListening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  };

  bSave.onclick = saveEvent;
  bCancel.onclick = resetForm;
  bDelete.onclick = () => activeId && deleteEvent(activeId);

  renderList();
})();
</script>
</body>
</html>
